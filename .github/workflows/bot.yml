name: Bot
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # FlareSolverr — Cloudflare bypass (baiscope.lk එකට)
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          TZ: Asia/Colombo
        # Health check — service ready නැතුව bot start වෙන්නේ නෑ
        options: >-
          --health-cmd "curl -f http://localhost:8191/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          sudo pip3 install --upgrade yt-dlp || pip3 install --upgrade yt-dlp
          yt-dlp --version

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxss1 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxrandr2 libcups2 libpango-1.0-0 \
            libcairo2 libxshmfence1 || true

      - name: Install npm dependencies
        run: npm install

      - name: Verify FlareSolverr is up
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8191/ | grep -q .; then
              echo "✅ FlareSolverr ready"
              exit 0
            fi
            echo "⏳ FlareSolverr ස්ටාර්ට් වෙනවා... ($i/30)"
            sleep 2
          done
          echo "⚠️ FlareSolverr ready නෑ — baiscope fallback direct mode එකට යනවා"
          # Hard fail කරන්නේ නෑ — bot එකට අනිත් commands වැඩ කරන්න ඕනි

      - name: Setup local bot API server
        if: ${{ vars.LOCAL_BOT_API == 'true' }}
        run: echo "LOCAL_BOT_API_SERVER=true" >> $GITHUB_ENV

      - name: Run bot
        run: node index.js
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_API_SERVER: ${{ secrets.BOT_API_SERVER }}
          ASITHA_KEY: ${{ secrets.ASITHA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FLARESOLVERR_URL: http://localhost:8191
