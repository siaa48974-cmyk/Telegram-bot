name: Bot

on:
  workflow_dispatch:
  push:
    branches: [main]

# GH_TOKEN එකෙන් workflow re-dispatch කරන්න permissions
permissions:
  actions: write
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # FlareSolverr — Cloudflare bypass (baiscope.lk එකට)
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          TZ: Asia/Colombo
        options: >-
          --health-cmd "curl -f http://localhost:8191/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          sudo pip3 install --upgrade yt-dlp || pip3 install --upgrade yt-dlp
          yt-dlp --version

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxss1 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxrandr2 libcups2 libpango-1.0-0 \
            libcairo2 libxshmfence1 || true

      - name: Install npm dependencies
        run: npm install

      - name: Verify FlareSolverr is up
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8191/ | grep -q .; then
              echo "✅ FlareSolverr ready"
              exit 0
            fi
            echo "⏳ FlareSolverr ස්ටාර්ට් වෙනවා... ($i/30)"
            sleep 2
          done
          echo "⚠️ FlareSolverr ready නෑ — baiscope fallback direct mode එකට යනවා"

      - name: Setup local bot API server
        if: ${{ vars.LOCAL_BOT_API == 'true' }}
        run: echo "LOCAL_BOT_API_SERVER=true" >> $GITHUB_ENV

      - name: Run bot (5h50m) + auto restart
        run: |
          node index.js &
          BOT_PID=$!
          echo "🚀 Bot started (PID: $BOT_PID)"
          echo "⏳ පැය 5:50ක් run වෙනවා... (GitHub 360min limit එකට කලින්)"

          # 21000 seconds = 5 hours 50 minutes
          sleep 21000

          echo "⏰ 5h50m ඉවර — bot එක stop කරලා fresh run එකක් trigger කරනවා"
          kill $BOT_PID 2>/dev/null || true
          sleep 5
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_API_SERVER: ${{ secrets.BOT_API_SERVER }}
          ASITHA_KEY: ${{ secrets.ASITHA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FLARESOLVERR_URL: http://localhost:8191

      - name: Re-run workflow (keep alive 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 60
          gh api \
            --method POST \
            repos/${{ github.repository }}/actions/workflows/${{ github.event_name && 'Bot' || 'Bot' }}.yml/dispatches \
            -f ref=${{ github.ref_name }}
          echo "✅ අලුත් Bot run එකක් trigger කළා — bot 24/7 alive"
