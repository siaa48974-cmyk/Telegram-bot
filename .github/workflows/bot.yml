name: Bot
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  actions: write
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          TZ: Asia/Colombo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }

      - name: Free disk + Fast Deps
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune -af
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libxss1 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libcups2 libpango-1.0-0 libcairo2 libxshmfence1
          sudo pip3 install -q yt-dlp -U
          df -h /

      - name: Start Local Bot API (2GB)
        run: |
          docker run -d --name tg-api -p 8081:8081 -v /tmp/tg-data:/var/lib/telegram-bot-api aiogram/telegram-bot-api:latest --api-id=${{ secrets.API_ID }} --api-hash=${{ secrets.API_HASH }} --local --http-port=8081
          for i in {1..30}; do if curl -sf http://localhost:8081/bot${{ secrets.TG_TOKEN }}/getMe > /dev/null; then echo "✅ Local API Ready - 2GB Enabled"; break; fi; sleep 2; done

      - name: Install npm
        run: npm install

      - name: Verify FlareSolverr
        run: |
          for i in {1..30}; do if curl -s http://localhost:8191/ | grep -q .; then echo "✅ FlareSolverr ready"; exit 0; fi; sleep 2; done

      - name: Run bot (5h50m)
        run: |
          node index.js &
          echo "🚀 Bot started via $LOCAL_API_URL"
          sleep 21000
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          LOCAL_API_URL: http://localhost:8081
          BOT_API_SERVER: http://localhost:8081
          ASITHA_KEY: ${{ secrets.ASITHA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FLARESOLVERR_URL: http://localhost:8191

      - name: Re-run (24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          gh api --method POST repos/${{ github.repository }}/actions/workflows/Bot.yml/dispatches -f ref=${{ github.ref_name }}
